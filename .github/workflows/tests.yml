name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data adapters without credentials
        run: python -m unittest discover -s source -p "test*.py"
      - name: Install desktop runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test UI shutdown and dialog cleanup with synthetic data
        run: python source/ui_regression.py
      - name: Test usage dashboard, exports, periods, and cleanup with synthetic data
        run: python source/ui_insights_regression.py
